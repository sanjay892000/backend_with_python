{% if messages %}
<div
  class="space-y-4 w-full max-w-lg fixed top-1 right-3 transition transform duration-300 ease-out opacity-0 translate-y-[1px]"
  id="alertBox"
>
  {% for message in messages %}
  
  {% if message.tags == "success" %}
  <div
    class="flex items-center justify-between bg-green-200/95 border border-green-300 text-green-800 px-4 py-4 rounded-md shadow-sm"
  >
    <p><i class="fa-solid fa-circle-check"></i> &nbsp; {{message}}</p>
    <span id="closeBtn" class="cursor-pointer"
      ><i class="fa-solid fa-xmark"></i
    ></span>
  </div>
  {% elif message.tags == "error" %}
  <div
    class="flex items-center justify-between bg-red-100 border border-red-300 text-red-800 px-4 py-4 rounded-md shadow-sm"
  >
    <p><i class="fa-solid fa-circle-xmark"></i> &nbsp; {{message}}</p>
    <span id="closeBtn" class="cursor-pointer"
      ><i class="fa-solid fa-xmark"></i
    ></span>
  </div>
  {% elif message.tags == "warning" %}
  <div
    class="flex items-center justify-between bg-yellow-100 border border-yellow-300 text-yellow-800 px-4 py-4 rounded-md shadow-sm"
  >
    <p><i class="fa-solid fa-triangle-exclamation"></i> &nbsp; {{message}}</p>
    <span id="closeBtn" class="cursor-pointer"
      ><i class="fa-solid fa-xmark"></i
    ></span>
  </div>
  {% else %}
  <div
    class="flex items-center justify-between bg-blue-100 border border-blue-300 text-blue-800 px-4 py-4 rounded-md shadow-sm"
  >
    <p><i class="fa-solid fa-circle-info"></i> &nbsp; {{message}}</p>
    <span id="closeBtn" class="cursor-pointer"
      ><i class="fa-solid fa-xmark"></i
    ></span>
  </div>
  {% endif %}
  
  {% endfor %}
</div>

<script>
  // Show alert with animation
  const alertBox = document.getElementById("alertBox");
  if (alertBox) {
    setTimeout(() => {
      alertBox.classList.remove("opacity-0", "-translate-y-5");
      alertBox.classList.add("opacity-100", "translate-y-0");
    }, 100);

    const ref = setTimeout(() => {
      alertBox.style.display = "none";
    }, 3000);
    // Close alert on icon click
    const closeBtn = document.getElementById("closeBtn");
    if (closeBtn) {
      closeBtn.addEventListener("click", () => {
        clearTimeout(ref);
        alertBox.classList.remove("opacity-100", "translate-y-0");
        alertBox.classList.add("opacity-0", "-translate-y-5");
        setTimeout(() => {
          alertBox.style.display = "none";
        }, 300);
      });
    }
  }
</script>
{% endif %}
