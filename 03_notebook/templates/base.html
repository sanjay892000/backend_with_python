{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %} myNoteBook App{% endblock title %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    {% include "labels/navbar.html" %}
    
    {% block content %} {% endblock content %}
    
    
    {% include "labels/footer.html" %}

    {% block scripts %}{% endblock scripts %}
    <script src="{% static 'js/script.js' %}"></script>
  </body>
</html>




{% comment %} <div class="space-y-4 w-full max-w-lg fixed top-1 right-3 ">
      <div
        class="flex items-center justify-between bg-green-200/95 border border-green-300 text-green-800 px-4 py-4 rounded-md shadow-sm"
      >
       <p><i class="fa-solid fa-circle-check"></i> &nbsp; Send message successfully </p> <span><i class="fa-solid fa-xmark"></i></span>
      </div>
    </div> {% endcomment %}
