{% if messages %}

<div
    id="toast-container"
    class="fixed top-5 right-5 z-[9999] space-y-4 w-96">

    {% for message in messages %}

        <div
            class="toast flex items-start gap-4 rounded-xl shadow-lg border
            p-4 bg-white animate-fade">

            <!-- Icon -->

            {% if message.tags == "success" %}

                <div
                    class="w-11 h-11 rounded-full
                    bg-green-100 flex items-center justify-center">

                    <i
                        class="fa-solid fa-circle-check
                        text-green-600 text-lg"></i>

                </div>

            {% elif message.tags == "error" %}

                <div
                    class="w-11 h-11 rounded-full
                    bg-red-100 flex items-center justify-center">

                    <i
                        class="fa-solid fa-circle-xmark
                        text-red-600 text-lg"></i>

                </div>

            {% elif message.tags == "warning" %}

                <div
                    class="w-11 h-11 rounded-full
                    bg-yellow-100 flex items-center justify-center">

                    <i
                        class="fa-solid fa-triangle-exclamation
                        text-yellow-600 text-lg"></i>

                </div>

            {% else %}

                <div
                    class="w-11 h-11 rounded-full
                    bg-blue-100 flex items-center justify-center">

                    <i
                        class="fa-solid fa-circle-info
                        text-blue-600 text-lg"></i>

                </div>

            {% endif %}

            <!-- Text -->

            <div class="flex-1">

                <h4
                    class="font-semibold capitalize">

                    {{ message.tags }}

                </h4>

                <p
                    class="text-sm text-slate-600 mt-1">

                    {{ message }}

                </p>

            </div>

            <!-- Close -->

            <button
                class="close-toast text-slate-400 hover:text-red-500">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

    {% endfor %}

</div>

{% endif %}
